services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3; head -n1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    image: obsidian-rag-api:latest
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      VECTOR_BACKEND: qdrant
      OBSIDIAN_VAULT_PATH: /vault
      SQLITE_PATH: /data/obsidian-rag-api.sqlite
    ports:
      - "8000:8000"
    volumes:
      - vault-data:/vault
      - app-data:/data

volumes:
  qdrant-data:
  vault-data:
  app-data:
