name: Release

# Builds the Docker image and creates a GitHub Release whenever a
# version tag (v*) is pushed. Images are published to GHCR under
# ghcr.io/<owner>/<repo>.
#
# Usage:
#   git tag v0.1.0
#   git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write    # create GitHub Releases
  packages: write    # push to GHCR

jobs:
  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # For a tag like v1.2.3 produces:
          #   ghcr.io/<owner>/<repo>:1.2.3
          #   ghcr.io/<owner>/<repo>:1.2
          #   ghcr.io/<owner>/<repo>:1
          #   ghcr.io/<owner>/<repo>:latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build & push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container image:
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
            See `README.md` and the `bruno/` collection for usage.
