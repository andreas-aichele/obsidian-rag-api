services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
    image: obsidian-rag-api:latest
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      VECTOR_BACKEND: qdrant
      OBSIDIAN_VAULT_PATH: /vault
      SQLITE_PATH: /data/obsidian-rag-api.sqlite
    ports:
      - "8000:8000"
    volumes:
      - vault-data:/vault
      - app-data:/data

volumes:
  qdrant-data:
  vault-data:
  app-data:
